name: Grammar tests

# The grammar's tests: the corpus, highlight and tag tests, the fuzz seeds and a minute of libFuzzer.
# Called by the Grammar workflow on every change and by Grammar release before it drafts anything.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: grammar/tree-sitter-daml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: grammar/tree-sitter-daml/package-lock.json

      - name: Install the pinned CLI
        run: npm ci

      - name: Generate the parser
        run: npx tree-sitter generate

      - name: Corpus tests
        run: npx tree-sitter test

      # Random edits to every corpus test, parsed incrementally, then undone: the tree must come
      # back as the test expects it. The CLI exits 0 even when tests fail, so its summary line
      # ("N daml corpus tests failed fuzzing") decides; each failure above it names its seed,
      # which TREE_SITTER_SEED replays. The seed is fixed: about one random seed in four hits a
      # layout bug inherited from tree-sitter-haskell. grammar-nightly.yml, run by hand, tries new ones.
      - name: Fuzz the corpus tests
        env:
          TREE_SITTER_SEED: '1'
        run: |
          set -o pipefail
          npx tree-sitter fuzz 2>&1 | tee "$RUNNER_TEMP/tree-sitter-fuzz.log"
          if grep -q 'corpus tests failed fuzzing' "$RUNNER_TEMP/tree-sitter-fuzz.log"; then
            echo "::error::$(grep 'corpus tests failed fuzzing' "$RUNNER_TEMP/tree-sitter-fuzz.log")"
            exit 1
          fi

      - name: Tests of the grammar's scripts
        working-directory: .
        run: node --test --test-reporter=spec 'grammar/scripts/*.test.mjs'

      # The checkouts the corpus is copied from depend only on the pins.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: grammar/test/.cache
          key: daml-corpus-${{ hashFiles('grammar/corpus-sources.psd1') }}

      - name: Collect the real-world corpus
        working-directory: .
        shell: pwsh
        run: ./scripts/collect-corpus.ps1

      # The corpus gate: at least 99% of the files parse without errors, every other one is a known
      # exception with its reason, and every Daml construct occurs. The report goes to the summary
      # whether the gate passes or not.
      - name: Corpus gate
        run: |
          status=0
          node ../scripts/corpus-gate.mjs --out "$RUNNER_TEMP/corpus.md" || status=$?
          cat "$RUNNER_TEMP/corpus.md" >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Incremental parsing after random edits to real files gives what a full parse gives. A new
      # seed every run covers new edits over time; a failure prints its seed and edits to replay.
      - name: Incremental parsing of the real-world corpus
        run: node ../scripts/edit-properties.mjs --cases 300 --seed ${{ github.run_number }}

      # Parsing speed against the budgets (5 000 lines in 40 ms, an edit in 25 ms). Shared runners
      # are too noisy to judge timings, so this reports and doesn't fail; the budgets are checked
      # on a quiet machine with the same command.
      - name: Parsing speed (report only)
        run: |
          { echo '### Parsing speed'; echo '```'; node ../scripts/perf.mjs --runs 10 || true; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      # The scanner and the tree-sitter runtime under the address and undefined-behaviour
      # sanitizers: every seed (the inputs of the corpus tests and the real-world files) parsed,
      # edited and undone once, then a minute of libFuzzer. The nightly workflow fuzzes longer.
      - name: Install libFuzzer
        run: |
          if ! printf 'int LLVMFuzzerTestOneInput(const char *d, unsigned long n) { return 0; }\n' | clang -x c -fsanitize=fuzzer -o "$RUNNER_TEMP/probe" - 2>/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q libclang-rt-dev || sudo apt-get install -y -q "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"
          fi

      - name: Build the sanitizer fuzzer
        run: bash ../fuzz/build.sh "$RUNNER_TEMP/fuzz"

      - name: Every seed under the sanitizers
        run: |
          mkdir -p "$RUNNER_TEMP/crashes"
          node ../scripts/fuzz-seeds.mjs "$RUNNER_TEMP/seeds"
          "$RUNNER_TEMP/fuzz/daml-fuzzer" -runs=0 -timeout=30 -rss_limit_mb=4096 -artifact_prefix="$RUNNER_TEMP/crashes/" "$RUNNER_TEMP/seeds"

      # A fixed libFuzzer seed, like the fixed seed of `tree-sitter fuzz` above: with a random one,
      # about one push in four would hit the inherited undo-after-recovery limitation
      # (grammar/UPSTREAM.md). The nightly keeps exploring with new seeds.
      - name: Fuzz for a minute
        run: |
          mkdir -p "$RUNNER_TEMP/fuzz-work"
          "$RUNNER_TEMP/fuzz/daml-fuzzer" -seed=1 -max_total_time=60 -timeout=10 -max_len=16384 -rss_limit_mb=4096 \
            -dict=../fuzz/daml.dict -artifact_prefix="$RUNNER_TEMP/crashes/" "$RUNNER_TEMP/fuzz-work" "$RUNNER_TEMP/seeds"

      - name: Keep what crashed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: ${{ runner.temp }}/crashes
          if-no-files-found: ignore
