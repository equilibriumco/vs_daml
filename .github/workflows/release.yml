name: Release

# Started by hand only. Builds the VSIX and the three NuGet packages with the given build number,
# runs the PR gate on them and keeps them as an artifact. Started from a tag v<version>, it also
# drafts a GitHub pre-release with those files, and then pushes them to the Visual Studio
# Marketplace and nuget.org, each push waiting for a person to approve the release environment.
# A person reviews and publishes the draft.
on:
  workflow_dispatch:
    inputs:
      build-number:
        description: Build number (the prerelease label's last part and the VSIX's fourth part)
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      EqDamlBuildNumber: ${{ inputs.build-number }}
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Toolchain preflight
        run: |
          Import-Module ./scripts/lib/Toolchain.psm1
          Select-BuildVsInstance | Format-List DisplayName, Version, MSBuildVersion, SdkVersion

      - name: Build and pack
        run: ./scripts/pack.ps1

      - name: Verify formatting
        run: dotnet format Equilibrium.Daml.VisualStudio.sln --verify-no-changes --no-restore

      - name: Test gate scripts
        run: |
          Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck
          ./scripts/test-scripts.ps1

      - name: Tests (PR gate)
        run: ./scripts/test.ps1 -Category All -Milestone PR -RequiredTools -Configuration Release -NoBuild

      - name: One version, named by the tag
        id: version
        run: |
          Import-Module ./scripts/lib/Release.psm1
          $version = Get-ReleaseVersion artifacts/packages
          $tag = Test-ReleaseTag -RefType $env:GITHUB_REF_TYPE -RefName $env:GITHUB_REF_NAME -Version $version.NuGet
          if ($tag) { Write-Host "::error::$tag"; exit 1 }
          Write-Host "Release $($version.NuGet) (VSIX $($version.Vsix))"
          "version=$($version.NuGet)" >> $env:GITHUB_OUTPUT

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            artifacts/packages
            artifacts/sbom
          if-no-files-found: error
          retention-days: 90

      - name: Upload logs and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-logs-${{ github.run_number }}
          path: |
            artifacts/logs
            artifacts/test
          if-no-files-found: ignore
          retention-days: 30

  draft:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/release

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          EQ Daml Tools for Visual Studio $VERSION.

          - \`Equilibrium.Daml.VisualStudio.vsix\`: the Visual Studio 2026 extension (x64).
          - \`Equilibrium.Daml.Sdk\`, \`Equilibrium.Daml.Build.CSharp\`, \`Equilibrium.Daml.Templates\`: the NuGet packages.
          - \`*.cdx.json\`: a CycloneDX SBOM for each of them.

          EQ Daml Tools for Visual Studio is an independent project by Equilibrium and is not affiliated with, sponsored by, or endorsed by Digital Asset. Daml and Canton are trademarks of Digital Asset (Switzerland) GmbH. Visual Studio is a trademark of Microsoft Corporation.
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --prerelease --verify-tag \
            --title "EQ Daml Tools $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP"/release/packages/* "$RUNNER_TEMP"/release/sbom/*

  marketplace:
    needs: [build, draft]
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    environment: release
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/release

      # Unsigned until 1.0: signing goes here, before the upload, once there is a certificate.
      - name: Publish to the Visual Studio Marketplace
        env:
          VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: ./scripts/publish-marketplace.ps1 -Vsix "$env:RUNNER_TEMP/release/packages/Equilibrium.Daml.VisualStudio.vsix"

  nuget:
    needs: [build, draft]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release

    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/release

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for package in "$RUNNER_TEMP"/release/packages/*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
