name: Release

# Started by hand only. Builds the VSIX and the three NuGet packages with the given build number,
# runs the Hosted gate on them and keeps them as an artifact. Started from a tag v<version>, it also
# drafts a GitHub pre-release with those files. Publishing is done by a person: the draft on
# GitHub, the VSIX on the Visual Studio Marketplace and the packages on nuget.org, from exactly
# these files. A hosted runner can't run the Full gate (no Visual Studio session, no dpm), so the
# person publishing runs it on the tagged commit first; the run summary says so.
on:
  workflow_dispatch:
    inputs:
      build-number:
        description: Build number (the prerelease label's last part and the VSIX's fourth part)
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      EqDamlBuildNumber: ${{ inputs.build-number }}
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Toolchain preflight
        run: |
          Import-Module ./scripts/lib/Toolchain.psm1
          Select-BuildVsInstance | Format-List DisplayName, Version, MSBuildVersion, SdkVersion

      - name: Build and pack
        run: ./scripts/pack.ps1

      - name: Verify formatting
        run: dotnet format Equilibrium.Daml.VisualStudio.sln --verify-no-changes --no-restore

      # The PowerShell Gallery now and then drops a download; one miss shouldn't fail the run.
      - name: Test gate scripts
        run: |
          foreach ($try in 1..3) {
            try {
              Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
              break
            }
            catch {
              if ($try -eq 3) { throw }
              Write-Host "::warning::Pester download failed (try $try of 3): $($_.Exception.Message)"
              Start-Sleep -Seconds 30
            }
          }
          ./scripts/test-scripts.ps1

      - name: Tests (Hosted gate)
        run: ./scripts/test.ps1 -Category All -Gate Hosted -RequiredTools -Configuration Release -NoBuild

      - name: One version, named by the tag
        id: version
        run: |
          Import-Module ./scripts/lib/Release.psm1
          $version = Get-ReleaseVersion artifacts/packages
          $tag = Test-ReleaseTag -RefType $env:GITHUB_REF_TYPE -RefName $env:GITHUB_REF_NAME -Version $version.NuGet
          if ($tag) { Write-Host "::error::$tag"; exit 1 }
          Write-Host "Release $($version.NuGet) (VSIX $($version.Vsix))"
          "version=$($version.NuGet)" >> $env:GITHUB_OUTPUT

      - name: What this run didn't prove
        run: |
          @(
            "## $env:GITHUB_REF_NAME at $env:GITHUB_SHA"
            ''
            'This run passed the **Hosted** gate: Unit, Process, Editor and MSBuild (fake backend), with coverage.'
            'It did **not** run the Contract, Integration or real-backend MSBuild tests.'
            'Before publishing, run the Full gate on this commit on a machine with Visual Studio 2026, dpm and a JDK:'
            ''
            '```'
            'pwsh scripts/test.ps1 -Category All -Gate Full -RequiredTools'
            '```'
          ) -join "`n" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            artifacts/packages
            artifacts/sbom
          if-no-files-found: error
          retention-days: 90

      - name: Upload logs and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-logs-${{ github.run_number }}
          path: |
            artifacts/logs
            artifacts/test
          if-no-files-found: ignore
          retention-days: 30

  draft:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/release

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          EQ Daml Tools for Visual Studio $VERSION.

          - \`Equilibrium.Daml.VisualStudio.vsix\`: the Visual Studio 2026 extension (x64).
          - \`Equilibrium.Daml.Sdk\`, \`Equilibrium.Daml.Build.CSharp\`, \`Equilibrium.Daml.Templates\`: the NuGet packages.
          - \`*.cdx.json\`: a CycloneDX SBOM for each of them.

          EQ Daml Tools for Visual Studio is an independent project by Equilibrium and is not affiliated with, sponsored by, or endorsed by Digital Asset. Daml and Canton are trademarks of Digital Asset (Switzerland) GmbH. Visual Studio is a trademark of Microsoft Corporation.
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --prerelease --verify-tag \
            --title "EQ Daml Tools $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP"/release/packages/* "$RUNNER_TEMP"/release/sbom/*

