name: Grammar

on:
  push:
    branches: [master, main]
    paths:
      - 'grammar/**'
      - 'native/**'
      - 'samples/**'
      - 'scripts/collect-corpus.ps1'
      - 'scripts/lib/Corpus.psm1'
      - '.github/workflows/grammar.yml'
      - '.github/workflows/grammar-artifacts.yml'
      - '.github/workflows/grammar-tests.yml'
  pull_request:
    paths:
      - 'grammar/**'
      - 'native/**'
      - 'samples/**'
      - 'scripts/collect-corpus.ps1'
      - 'scripts/lib/Corpus.psm1'
      - '.github/workflows/grammar.yml'
      - '.github/workflows/grammar-artifacts.yml'
      - '.github/workflows/grammar-tests.yml'

permissions:
  contents: read

concurrency:
  group: grammar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/grammar-tests.yml

  # What a release publishes (daml_ts.dll for x64 and ARM64, the WebAssembly module, the sources
  # with the generated parser), built on every change so a broken build shows before a tag does.
  artifacts:
    uses: ./.github/workflows/grammar-artifacts.yml
