name: Grammar

on:
  push:
    branches: [master, main]
    paths:
      - 'grammar/**'
      - 'samples/**'
      - 'scripts/collect-corpus.ps1'
      - 'scripts/lib/Corpus.psm1'
      - '.github/workflows/grammar.yml'
  pull_request:
    paths:
      - 'grammar/**'
      - 'samples/**'
      - 'scripts/collect-corpus.ps1'
      - 'scripts/lib/Corpus.psm1'
      - '.github/workflows/grammar.yml'

permissions:
  contents: read

concurrency:
  group: grammar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: grammar/tree-sitter-daml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: grammar/tree-sitter-daml/package-lock.json

      - name: Install the pinned CLI
        run: npm ci

      - name: Generate the parser
        run: npx tree-sitter generate

      - name: Corpus tests
        run: npx tree-sitter test

      # Random edits to every corpus test, parsed incrementally, then undone: the tree must come
      # back as the test expects it.
      - name: Fuzz the corpus tests
        run: npx tree-sitter fuzz

      - name: Tests of the grammar's scripts
        working-directory: .
        run: node --test --test-reporter=spec 'grammar/scripts/*.test.mjs'

      # The checkouts the corpus is copied from depend only on the pins.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: grammar/test/.cache
          key: daml-corpus-${{ hashFiles('grammar/corpus-sources.psd1') }}

      - name: Collect the real-world corpus
        working-directory: .
        shell: pwsh
        run: ./scripts/collect-corpus.ps1

      # The corpus gate: at least 99% of the files parse without errors, every other one is a known
      # exception with its reason, and every Daml construct occurs. The report goes to the summary
      # whether the gate passes or not.
      - name: Corpus gate
        run: |
          status=0
          node ../scripts/corpus-gate.mjs --out "$RUNNER_TEMP/corpus.md" || status=$?
          cat "$RUNNER_TEMP/corpus.md" >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Incremental parsing after random edits to real files gives what a full parse gives. A new
      # seed every run covers new edits over time; a failure prints its seed and edits to replay.
      - name: Incremental parsing of the real-world corpus
        run: node ../scripts/edit-properties.mjs --cases 300 --seed ${{ github.run_number }}