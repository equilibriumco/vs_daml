name: Grammar

on:
  push:
    branches: [master, main]
    paths:
      - 'grammar/**'
      - 'samples/**'
      - 'scripts/collect-corpus.ps1'
      - 'scripts/lib/Corpus.psm1'
      - '.github/workflows/grammar.yml'
  pull_request:
    paths:
      - 'grammar/**'
      - 'samples/**'
      - 'scripts/collect-corpus.ps1'
      - 'scripts/lib/Corpus.psm1'
      - '.github/workflows/grammar.yml'

permissions:
  contents: read

concurrency:
  group: grammar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: grammar/tree-sitter-daml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: grammar/tree-sitter-daml/package-lock.json

      - name: Install the pinned CLI
        run: npm ci

      - name: Generate the parser
        run: npx tree-sitter generate

      - name: Corpus tests
        run: npx tree-sitter test

      # The checkouts the corpus is copied from depend only on the pins.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: grammar/test/.cache
          key: daml-corpus-${{ hashFiles('grammar/corpus-sources.psd1') }}

      - name: Collect the real-world corpus
        working-directory: .
        shell: pwsh
        run: ./scripts/collect-corpus.ps1

      # How much of the corpus parses without errors. It reports and doesn't fail: the grammar
      # learns Daml step by step, and the 99% gate comes with the quality gates.
      - name: Parse the corpus
        run: |
          find ../test/real-world -type f -name '*.daml' > "$RUNNER_TEMP/daml-files"
          npx tree-sitter parse --paths "$RUNNER_TEMP/daml-files" --quiet --stat | tail -n 1 | tee "$RUNNER_TEMP/parse-stat" || true
          { echo '### Real-world corpus parsed by the grammar'; echo '```'; cat "$RUNNER_TEMP/parse-stat"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"