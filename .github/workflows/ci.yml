name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces its run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    # windows-latest still ships VS 2022 only; this label carries VS 2026 / MSBuild 18.
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Fail early and readably when the image stops matching the toolchain we build with.
      - name: Toolchain preflight
        run: |
          Import-Module ./scripts/lib/Toolchain.psm1
          Get-VsInstances | Format-Table DisplayName, Version, IsPrerelease, MSBuildVersion, HasDotNetSdkResolver -AutoSize
          Select-BuildVsInstance | Format-List DisplayName, Version, MSBuildVersion, SdkVersion

      # Release build plus packaging; pack.ps1 also rejects a VSIX with the wrong targets or
      # with assemblies Visual Studio provides itself, and writes a CycloneDX SBOM per artifact,
      # failing when one isn't covered by NOTICE or a vendored file doesn't match its PIN.
      - name: Build and pack
        run: ./scripts/pack.ps1

      - name: Verify formatting
        run: dotnet format Equilibrium.Daml.VisualStudio.sln --verify-no-changes --no-restore

      # The PowerShell Gallery now and then drops a download; one miss shouldn't fail the run.
      - name: Test gate scripts
        run: |
          foreach ($try in 1..3) {
            try {
              Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
              break
            }
            catch {
              if ($try -eq 3) { throw }
              Write-Host "::warning::Pester download failed (try $try of 3): $($_.Exception.Message)"
              Start-Sleep -Seconds 30
            }
          }
          ./scripts/test-scripts.ps1

      # The PR profile in scripts/test-gates.psd1: every required project must run tests on each
      # of its frameworks without skips; coverage is reported, not enforced.
      - name: Tests (PR gate)
        run: ./scripts/test.ps1 -Category All -Gate PR -RequiredTools -Configuration Release -NoBuild

      # Two paths: the artifact holds packages/ and sbom/ folders.
      - name: Upload VSIX, packages and SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ github.run_number }}
          path: |
            artifacts/packages
            artifacts/sbom
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ github.run_number }}
          path: |
            artifacts/logs
            artifacts/test
          if-no-files-found: ignore
          retention-days: 14
